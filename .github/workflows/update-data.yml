name: Update sector data

on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-sector-data
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan sector sources
        run: python scrape.py

      - name: Commit latest data
        run: |
          git config user.name "akaryakit-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update sector data"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload fresh dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy fresh dashboard
        id: deployment
        uses: actions/deploy-pages@v4
