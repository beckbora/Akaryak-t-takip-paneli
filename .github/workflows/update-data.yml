name: Update sector data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'price_scan.py'
      - 'price_expectation.py'
      - 'price_expectation_state.py'
      - 'live_scan.py'
      - 'scrape.py'
      - 'source_overrides.py'
      - 'source_parsers.py'
      - 'sector_intelligence.py'
      - 'update_prices.py'
      - 'update_expectation.py'
      - 'update_data.py'
      - 'live.html'
      - 'prices.html'
      - 'api/index.py'
      - 'ios-pwa.js'
      - 'sw.js'
      - 'send_push.py'
      - 'supabase_push_setup.sql'
      - 'push-requirements.txt'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
    # 12:00 Türkiye saati (UTC+3). GitHub scheduled jobs birkaç dakika gecikebilir.
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-sector-data
  cancel-in-progress: true

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest snapshots
        shell: bash
        run: |
          set -u
          BASE="https://beckbora.github.io/Akaryak-t-takip-paneli"
          for FILE in data.json prices.json price_expectation.json; do
            TMP="/tmp/${FILE}"
            URL="${BASE}/${FILE}?t=$(date +%s)"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 5 --max-time 20 "$URL" -o "$TMP"               && python -m json.tool "$TMP" >/dev/null 2>&1; then
              mv "$TMP" "$FILE"
              echo "Restored $FILE from the last GitHub Pages snapshot"
            else
              rm -f "$TMP"
              echo "Could not restore $FILE; repository fallback will be used"
            fi
          done

      - name: Preserve previous expectation snapshot
        run: cp price_expectation.json /tmp/price_expectation_before.json

      - name: Scan sector sources
        run: python update_data.py

      - name: Scan fuel prices
        run: python update_prices.py

      - name: Scan fuel price expectations
        run: python update_expectation.py

      - name: Generate public push config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY_B64: ${{ secrets.VAPID_PRIVATE_KEY_B64 }}
        run: |
          python - <<'PY'
          import json, os
          data = {
              "configured": bool(os.getenv("SUPABASE_URL") and os.getenv("SUPABASE_PUBLISHABLE_KEY")),
              "sender_configured": bool(os.getenv("SUPABASE_SECRET_KEY") and os.getenv("VAPID_PRIVATE_KEY_B64")),
              "supabase_url": os.getenv("SUPABASE_URL", ""),
              "supabase_publishable_key": os.getenv("SUPABASE_PUBLISHABLE_KEY", ""),
              "vapid_public_key": "BCd3xQNt5Ba-iH4uonQU8VCI2E6RZxd3LRWqehRLBLZaRgEjm6qfyNCVyYEkfwd1MiIVhVznd6mLYuCdcG4USM0",
          }
          with open("push-config.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Send background Web Push
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PRIVATE_KEY_B64: ${{ secrets.VAPID_PRIVATE_KEY_B64 }}
          VAPID_SUBJECT: https://petrol-piyasasi-takip.vercel.app
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ] || [ -z "$VAPID_PRIVATE_KEY_B64" ]; then
            echo "Web Push secrets are not configured yet; skipping."
            exit 0
          fi
          pip install -q -r push-requirements.txt
          python send_push.py --previous /tmp/price_expectation_before.json --current price_expectation.json

      # IMPORTANT: generated JSON is deliberately NOT committed to main.
      # GitHub Pages is the rolling snapshot store. This prevents each 10-minute
      # refresh from triggering a new Vercel deployment.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload fresh dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '.'

      - name: Deploy fresh dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
