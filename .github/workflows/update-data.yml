name: Update sector data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'price_scan.py'
      - 'price_expectation.py'
      - 'price_expectation_state.py'
      - 'live_scan.py'
      - 'scrape.py'
      - 'source_overrides.py'
      - 'source_parsers.py'
      - 'sector_intelligence.py'
      - 'update_prices.py'
      - 'update_expectation.py'
      - 'update_data.py'
      - 'live.html'
      - 'prices.html'
      - 'api/index.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
    # 12:00 Türkiye saati (UTC+3). GitHub scheduled jobs birkaç dakika gecikebilir.
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-sector-data
  cancel-in-progress: true

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest snapshots
        shell: bash
        run: |
          set -u
          BASE="https://beckbora.github.io/Akaryak-t-takip-paneli"
          for FILE in data.json prices.json price_expectation.json; do
            TMP="/tmp/${FILE}"
            URL="${BASE}/${FILE}?t=$(date +%s)"
            if curl -fL --retry 2 --retry-delay 2 --connect-timeout 5 --max-time 20 "$URL" -o "$TMP"               && python -m json.tool "$TMP" >/dev/null 2>&1; then
              mv "$TMP" "$FILE"
              echo "Restored $FILE from the last GitHub Pages snapshot"
            else
              rm -f "$TMP"
              echo "Could not restore $FILE; repository fallback will be used"
            fi
          done

      - name: Scan sector sources
        run: python update_data.py

      - name: Scan fuel prices
        run: python update_prices.py

      - name: Scan fuel price expectations
        run: python update_expectation.py

      # IMPORTANT: generated JSON is deliberately NOT committed to main.
      # GitHub Pages is the rolling snapshot store. This prevents each 10-minute
      # refresh from triggering a new Vercel deployment.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload fresh dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy fresh dashboard
        id: deployment
        uses: actions/deploy-pages@v4
