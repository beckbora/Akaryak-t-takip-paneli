name: Update sector data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'price_scan.py'
      - 'price_expectation.py'
      - 'live_scan.py'
      - 'scrape.py'
      - 'source_overrides.py'
      - 'update_prices.py'
      - 'update_expectation.py'
      - 'update_data.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
    # 12:00 Türkiye saati (UTC+3). GitHub scheduled jobs can start a few minutes late.
    - cron: '0 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-sector-data
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan sector sources
        run: python update_data.py

      - name: Scan fuel prices
        run: python update_prices.py

      - name: Scan fuel price expectations
        run: python update_expectation.py

      - name: Commit latest data
        run: |
          git config user.name "akaryakit-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json prices.json price_expectation.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update sector, fuel price and expectation data"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload fresh dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy fresh dashboard
        id: deployment
        uses: actions/deploy-pages@v4
