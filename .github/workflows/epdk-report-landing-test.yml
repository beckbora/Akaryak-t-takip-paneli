name: EPDK report landing page test

on:
  push:
    branches: [fix/epdk-report-landing-pages]
    paths:
      - 'source_parsers.py'
      - 'source_overrides.py'
      - 'scrape.py'
      - '.github/workflows/epdk-report-landing-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Verify report landing page mapping
        run: |
          python - <<'PY'
          import requests
          from scrape import SOURCES, HEADERS, candidates
          from source_parsers import parse_epdk_report
          from source_overrides import _apply_epdk_sector_report_landing_pages

          report_source=next(x for x in SOURCES if x['key']=='epdk_petrol_istatistik')
          announcement_source=next(x for x in SOURCES if x['key']=='epdk')

          rr=requests.get(report_source['url'],headers=HEADERS,timeout=20)
          rr.raise_for_status()
          reports=parse_epdk_report(report_source,rr.text)

          ar=requests.get(announcement_source['url'],headers=HEADERS,timeout=20)
          ar.raise_for_status()
          announcements=candidates(announcement_source,ar.text)

          raw=reports+announcements
          mapped=_apply_epdk_sector_report_landing_pages(reports,raw)
          item=next(x for x in mapped if x['title'].startswith('Temmuz 2026 Petrol Piyasası Sektör Raporu'))

          print('LANDING_URL',item['url'])
          print('REPORT_PERIOD',item.get('report_period'))
          assert 'DownloadDocument' not in item['url'], item['url']
          assert '/Detay/Icerik/4-' in item['url'], item['url']
          assert 'temmuz-ayi-sektor-raporlari' in item['url'].lower(), item['url']
          assert item.get('report_period') == '2026-07', item.get('report_period')

          page=requests.get(item['url'],headers=HEADERS,timeout=20)
          page.raise_for_status()
          assert 'Petrol Piyasası Sektör Raporu - Temmuz 2026' in page.text or 'Petrol Piyasası Sektör Raporu' in page.text
          print('EPDK_REPORT_LANDING_OK')
          PY
