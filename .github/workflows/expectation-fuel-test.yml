name: Expectation fuel classification test

on:
  push:
    branches: [fix/expectation-fuel-classification]
    paths:
      - 'price_expectation.py'
      - '.github/workflows/expectation-fuel-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Verify classification
        run: |
          python - <<'PY'
          import price_expectation as p

          ht_title = "Benzine 12,48 TL zam gelecek mi, ne zaman? 27 Eylül 2026 güncel akaryakıt fiyatları ile LPG, motorin ve benzin fiyatları ne kadar?"
          ht_desc = "Benzin fiyatlarına zam beklentisi yeniden gündeme geldi. Mevcut hesaplamalara göre benzinin litre fiyatına 12 lira 48 kuruş zam gelmesi bekleniyor."
          text = ht_title + ". " + ht_desc
          status = p._status(text)
          sentence = p._event_sentence(text, status)
          fuel = p._fuel(sentence) or p._fuel(ht_title)
          amount = p._amount(sentence) or p._amount(ht_title) or p._amount(ht_desc)
          print("HABERTURK_CASE", status, fuel, amount, sentence)
          assert status == "up"
          assert fuel == "gasoline", fuel
          assert amount == 12.48, amount

          diesel_title = "Motorine 4,62 TL zam bekleniyor! Güncel LPG, benzin ve motorin fiyatları"
          diesel_desc = "Sektör kaynaklarına göre motorine 4,62 TL zam yapılması bekleniyor."
          text = diesel_title + ". " + diesel_desc
          status = p._status(text)
          sentence = p._event_sentence(text, status)
          fuel = p._fuel(sentence) or p._fuel(diesel_title)
          amount = p._amount(sentence) or p._amount(diesel_title) or p._amount(diesel_desc)
          print("DIESEL_CASE", status, fuel, amount, sentence)
          assert status == "up"
          assert fuel == "diesel", fuel
          assert amount == 4.62, amount

          print("EXPECTATION_FUEL_CLASSIFICATION_OK")
          PY
