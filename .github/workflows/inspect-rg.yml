name: Inspect today's Resmi Gazete item

on:
  push:
    branches: [fix/resmi-gazete-akaryakit-otv]
    paths:
      - '.github/workflows/inspect-rg.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Inspect official and mirror context
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from live_scan import resmi_gazete_live, RG_HEADERS

          items,status=resmi_gazete_live(days=1)
          print("RG_STATUS",status)
          for x in items:
              if "11822" in (x.get("title") or ""):
                  print("RG_ITEM",x)

          url="https://www.resmigazeteozeti.com/tarih/2026-10-01"
          r=requests.get(url,headers=RG_HEADERS,timeout=12)
          print("MIRROR_STATUS",r.status_code,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          for node in soup.find_all(["article","section","div","h3","h4"]):
              text=" ".join(node.get_text(" ",strip=True).split())
              if "11822" in text:
                  print("MIRROR_CONTEXT",text[:3500])
                  break
          PY
