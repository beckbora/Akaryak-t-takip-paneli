name: Resmi Gazete fuel tax regression test

on:
  push:
    branches: [fix/resmi-gazete-akaryakit-otv]
    paths:
      - '.github/workflows/inspect-rg.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Verify 11822 reaches sector radar
        run: |
          python - <<'PY'
          from live_scan import resmi_gazete_live
          from scrape import category
          from source_overrides import _sanitize, _apply_resmi_gazete_fuel_override, _sector_item

          assert category("Bazı Mallara Uygulanan Özel Tüketim Vergisi Tutarlarının Yeniden Belirlenmesi") == "Vergi / ÖTV"

          items,status=resmi_gazete_live(days=1)
          raw=next(x for x in items if "11822" in (x.get("title") or ""))
          item=_apply_resmi_gazete_fuel_override(_sanitize(raw))

          print("RG_11822",item)
          assert item["category"] == "Vergi / ÖTV", item
          assert item["market"] == "Petrol/LPG", item
          assert item["record_type"] == "Cumhurbaşkanı Kararı", item
          assert item["severity"] == "critical", item
          assert item["rg_fuel_related"] is True
          assert _sector_item(item) is True
          assert item["url"] == "https://resmigazete.gov.tr/01.10.2026"
          assert "benzin" in item["summary"].casefold()
          assert "lpg" in item["summary"].casefold()
          print("RG_FUEL_TAX_RADAR_OK")
          PY
