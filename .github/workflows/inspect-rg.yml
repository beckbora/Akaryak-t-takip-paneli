name: Inspect today's Resmi Gazete item

on:
  push:
    branches: [fix/resmi-gazete-akaryakit-otv]
    paths:
      - '.github/workflows/inspect-rg.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5 pypdf==6.1.1
      - name: Inspect 11822
        run: |
          python - <<'PY'
          from live_scan import resmi_gazete_live
          items,status=resmi_gazete_live(days=1)
          print("RG_STATUS",status)
          for x in items:
              if "11822" in (x.get("title") or "") or "Özel Tüketim Vergisi" in (x.get("title") or ""):
                  print("RG_ITEM",x)
                  import io, requests
                  from pypdf import PdfReader
                  r=requests.get(x["url"],timeout=20)
                  r.raise_for_status()
                  text=" ".join((p.extract_text() or "") for p in PdfReader(io.BytesIO(r.content)).pages)
                  low=text.casefold()
                  terms=[t for t in ("benzin","motorin","lpg","otogaz","kurşunsuz","2710","özel tüketim vergisi") if t in low]
                  print("RG_PDF_TERMS",terms)
                  print("RG_PDF_SNIPPET",text[:3500].replace("\n"," "))
          PY
