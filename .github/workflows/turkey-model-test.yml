name: Turkey fuel model v2 smoke test

on:
  push:
    branches: [feature/turkiye-yakit-model-v2]
    paths:
      - 'brent_scan.py'
      - 'update_brent.py'
      - '.github/workflows/turkey-model-test.yml'

jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Restore live snapshots
        run: |
          BASE="https://beckbora.github.io/Akaryak-t-takip-paneli"
          for FILE in prices.json price_expectation.json brent.json; do
            curl -fL --retry 2 "$BASE/$FILE?t=$(date +%s)" -o "$FILE"
          done
      - name: Run Turkey model
        run: |
          python update_brent.py
          python - <<'PY'
          import json
          p=json.load(open('prices.json',encoding='utf-8'))
          e=json.load(open('price_expectation.json',encoding='utf-8'))
          print('EXPECTATION_ITEMS',e.get('items'))
          material=[]
          for x in p.get('changes') or []:
              try: delta=float(x.get('delta') or 0)
              except: continue
              if abs(delta)>=0.50 and x.get('fuel') in ('Motorin','Benzin 95'):
                  material.append((x.get('detected_at'),x.get('location'),x.get('fuel'),delta,x.get('old_price'),x.get('new_price')))
          print('MATERIAL_CHANGES',material[:30])
          d=json.load(open('brent.json',encoding='utf-8'))
          print('BRENT_JSON_KEYS',list(d.keys()))
          print('BRENT_ERROR',d.get('error'))
          print('BRENT_SOURCES',d.get('sources'))
          for key in ('diesel','gasoline'):
              m=d['fuel_models'][key]
              print('MODEL_RESULT',key,'impact=',m['estimated_impact_tl_l'],'baseline=',m['baseline_at'],'cif=',m.get('cif_med_price_usd_mt'),'cif_nowcast=',m.get('cif_med_nowcast_usd_mt'),'brent_pct=',m.get('brent_change_percent_since_cif'),'fx_pct=',m.get('fx_change_percent_since_cif'),'compare=',m['comparison'])
          print('BRENT_CONTEXT',d['brent']['price_usd_bbl'],d['brent_only_context'])
          PY
