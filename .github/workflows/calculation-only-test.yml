name: Calculation-only Turkey estimate test

on:
  push:
    branches: [feature/calculation-only-turkey-estimate]
    paths:
      - 'brent_scan.py'
      - '.github/workflows/calculation-only-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Restore live snapshots
        run: |
          BASE="https://beckbora.github.io/Akaryak-t-takip-paneli"
          for FILE in prices.json price_expectation.json brent.json; do
            curl -fL --retry 2 "$BASE/$FILE?t=$(date +%s)" -o "$FILE"
          done
      - name: Verify news cannot alter calculation
        run: |
          python update_brent.py
          python - <<'PY'
          import json
          d=json.load(open('brent.json',encoding='utf-8'))
          for key in ('diesel','gasoline'):
              m=d['fuel_models'][key]
              c=m.get('comparison') or {}
              calc=float(m['calculated_estimate_tl_l'])
              displayed=float(m['estimated_impact_tl_l'])
              assert abs(calc-displayed)<1e-9, (key,calc,displayed)
              print('CALC_ONLY',key,'calculation=',calc,'news=',c.get('expectation_tl_l'),'comparison=',c.get('label'),'basis=',m.get('estimate_basis'))
          assert d.get('version') == 4, d.get('version')
          print('CALCULATION_ONLY_OK')
          PY
